name: Build Wimboes

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-multilib binutils qemu-utils

      - name: Fix line endings
        run: |
          sed -i 's/\r$//' Makefile
          find src -type f -exec sed -i 's/\r$//' {} +

      - name: Build image and VDI
        run: |
          make clean
          make build/wimboes.img
          truncate -s 32M build/wimboes.img
          ls -l build/wimboes.img
          make vdi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wimboes
          path: |
            build/wimboes.img
            build/wimboes.vdi

      - name: Move 'latest' tag
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        run: |
          git config user.name  "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git tag -f latest
          git push -f origin latest

      - name: Publish 'latest' release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Wimboes - latest build
          body: "Automatic build of commit ${{ github.sha }}. Use wimboes.vdi in VirtualBox (Other/Unknown 32-bit, BIOS, 128 MB RAM)."
          prerelease: true
          files: |
            build/wimboes.vdi
            build/wimboes.img
