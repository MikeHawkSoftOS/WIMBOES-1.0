name: Build Wimboes

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-multilib binutils qemu-utils qemu-system-x86

      - name: Normalize line endings
        run: |
          sed -i 's/\r$//' Makefile
          find src test tools -type f \( -name '*.c' -o -name '*.h' -o -name '*.S' -o -name '*.ld' -o -name '*.sh' -o -name '*.py' \) -exec sed -i 's/\r$//' {} +

      - name: Build disk image
        run: |
          make clean
          make
          make vdi

      - name: Package outputs
        run: |
          mkdir -p dist
          cp build/wimboes.img build/wimboes.vdi build/kernel.bin dist/
          gzip -k -9 dist/wimboes.img
          sha256sum dist/* > dist/SHA256SUMS.txt

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wimboes-${{ github.sha }}
          path: dist/*
          retention-days: 30

      - name: QEMU boot smoke test
        run: |
          timeout 20 qemu-system-i386 -drive file=build/wimboes.img,format=raw -m 128 -vga std \
            -display none -no-reboot -monitor none -serial none &
          QPID=$!
          sleep 10
          if kill -0 $QPID 2>/dev/null; then
            echo "Booted and still running after 10s - OK"
            kill $QPID
          else
            echo "QEMU exited early (crash or triple fault)"; exit 1
          fi

      - name: Move 'latest' tag
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        run: |
          git config user.name  "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git tag -f latest
          git push -f origin latest

      - name: Publish 'latest' release
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Wimboes - latest build
          body: |
            Automatic build of commit ${{ github.sha }}.
            - wimboes.img.gz : raw disk image (gunzip it, then boot in QEMU/VMware)
            - wimboes.vdi    : VirtualBox disk (Other/Unknown 32-bit, BIOS, 128 MB RAM)
          prerelease: true
          files: |
            dist/wimboes.img.gz
            dist/wimboes.vdi
            dist/kernel.bin
            dist/SHA256SUMS.txt

  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Normalize line endings
        run: |
          sed -i 's/\r$//' Makefile
          find src test -type f -exec sed -i 's/\r$//' {} +
      - name: Run native UI tests
        run: make test
      - name: Upload UI screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-screenshots
          path: /tmp/shots
          if-no-files-found: ignore
